name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python dependencies
        run: pip install -e "python[train]"

      - name: Build
        run: make

      - name: Run C++, C API, and Python tests
        env:
          GITHUB_ACTIONS: true
        run: make rebuild test

      - name: CMake configure and build
        run: |
          cmake -B cmake-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DNETKIT_CMSIS_NN=OFF -DNETKIT_XNNPACK=OFF
          cmake --build cmake-build
          ./cmake-build/netkit test

      - name: Build and run C++ example
        run: |
          make example-cpp
          ./examples/infer_cpp models/test_mlp.nk 1 2

      - name: Build and run C example
        run: |
          make example-c
          ./examples/infer_c models/test_mlp.nk 1 2

      - name: CLI smoke test
        run: |
          make netkit
          ./netkit run models/test_mlp.nk --input 1,2
          ./netkit inspect models/test_mlp.nk
          ./netkit inspect models/mnist_cnn.nk --full || true

  cppcheck:
      name: Cppcheck static analysis
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v4
        - name: Install Cppcheck
          run: sudo apt-get update && sudo apt-get install -y cppcheck
        - name: Analyze project-owned C/C++ sources
          run: |
            # This version of Cppcheck flags existing aligned float-buffer casts,
            # packed model-data access, deliberate fixed-point shifts, and
            # value-initialized XNNPACK runtime objects. Exceptions apply only
            # to reviewed files; remaining findings still fail this job.
            cppcheck --error-exitcode=1 --quiet --enable=warning,performance,portability \
              --inline-suppr --suppress=missingIncludeSystem --std=c++20 \
              --suppress=invalidPointerCast:src/conv_dispatch.cpp \
              --suppress=invalidPointerCast:src/nk_loader.cpp \
              --suppress=invalidPointerCast:tests/test_c_api.c \
              --suppress=memsetClassFloat:src/nk_loader.cpp \
              --suppress=shiftTooManyBitsSigned:src/quant_softmax_s8.cpp \
              --suppress=legacyUninitvar:src/xnnpack_float_backend.cpp \
              --suppress=legacyUninitvar:src/xnnpack_quant_backend.cpp \
              -Iinclude include src tests
